name: Release Build

on:
  release:
    types: [published]
  push:
    branches: [preview, rebuild]

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_upload: ${{ steps.version.outputs.should_upload }}
    steps:
      - name: Determine version and upload target
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "should_upload=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "rebuild" ]; then
            # Get latest release tag
            LATEST=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName -q '.[0].tagName')
            echo "version=${LATEST}" >> $GITHUB_OUTPUT
            echo "should_upload=true" >> $GITHUB_OUTPUT
          else
            echo "version=preview" >> $GITHUB_OUTPUT
            echo "should_upload=false" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: [resolve-version]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NSIS
        run: |
          choco install nsis -y
          # Add NSIS to PATH for current session
          $env:Path += ";C:\Program Files (x86)\NSIS"
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Ensure MinGW build tools
        run: |
          # Windows runners have MinGW gcc at C:\mingw64\bin and CMake pre-installed.
          # Just ensure ninja is available (install via choco if missing).
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          Write-Host "gcc:   $((Get-Command gcc).Source)"
          Write-Host "g++:   $((Get-Command g++).Source)"
          Write-Host "cmake: $((Get-Command cmake).Source)"
          Write-Host "ninja: $((Get-Command ninja).Source)"
        shell: pwsh

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.98

      - name: Build piper native DLLs
        run: .\scripts\build-libpiper.ps1
        shell: pwsh

      - name: Build GUI, CLI and installer
        run: .\scripts\build.ps1
        shell: pwsh

      - name: Name artifacts by version
        run: |
          Move-Item -Force "build/bin/Narration Studio-amd64-installer.exe" "build/bin/Narration-Studio-${{ needs.resolve-version.outputs.version }}-Windows-Installer.exe"
          Move-Item -Force "build/bin/nstudio-cli.exe" "build/bin/nstudio-cli-${{ needs.resolve-version.outputs.version }}-Windows.exe"
        shell: pwsh

      - name: Upload Windows Installer
        if: needs.resolve-version.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.resolve-version.outputs.version }} "build/bin/Narration-Studio-${{ needs.resolve-version.outputs.version }}-Windows-Installer.exe" --clobber
        shell: pwsh

      - name: Upload Windows CLI
        if: needs.resolve-version.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.resolve-version.outputs.version }} "build/bin/nstudio-cli-${{ needs.resolve-version.outputs.version }}-Windows.exe" --clobber
        shell: pwsh

  build-windows-dll:
    needs: [resolve-version]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Ensure MinGW build tools
        run: |
          # Windows runners have MinGW gcc at C:\mingw64\bin and CMake pre-installed.
          # Just ensure ninja is available (install via choco if missing).
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          Write-Host "gcc:   $((Get-Command gcc).Source)"
          Write-Host "g++:   $((Get-Command g++).Source)"
          Write-Host "cmake: $((Get-Command cmake).Source)"
          Write-Host "ninja: $((Get-Command ninja).Source)"
        shell: pwsh

      - name: Build piper native DLLs
        run: .\scripts\build-libpiper.ps1
        shell: pwsh

      - name: Build nstudio DLL bundle
        run: .\scripts\build-dll.ps1 -Clean
        shell: pwsh

      - name: Package DLL zip
        run: |
          $zipName = "Narration-Studio-${{ needs.resolve-version.outputs.version }}-Windows-DLL.zip"
          $outDir = "build\bin\dll"
          if (-not (Test-Path $outDir)) {
            Write-Error "DLL output directory not found: $outDir"
            exit 1
          }
          Compress-Archive -Path "$outDir\*" -DestinationPath "build\bin\$zipName" -Force
          Write-Host "Created: build\bin\$zipName"
          Get-ChildItem "build\bin\$zipName" | Select-Object Name, Length
        shell: pwsh

      - name: Upload DLL zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nstudio-dll-${{ needs.resolve-version.outputs.version }}
          path: build/bin/Narration-Studio-${{ needs.resolve-version.outputs.version }}-Windows-DLL.zip
          if-no-files-found: error

      - name: Upload DLL zip to release
        if: needs.resolve-version.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.resolve-version.outputs.version }} "build/bin/Narration-Studio-${{ needs.resolve-version.outputs.version }}-Windows-DLL.zip" --clobber
        shell: pwsh

  build-macos:
    needs: [resolve-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build GUI and CLI
        run: bash scripts/build-osx.sh

      - name: Package macOS GUI and CLI
        run: |
          cd build/bin
          ditto -c -k --keepParent "Narration Studio.app" "Narration-Studio-${{ needs.resolve-version.outputs.version }}-OSX.zip"
          cp nstudio-cli-osx "nstudio-cli-${{ needs.resolve-version.outputs.version }}-OSX"

      - name: Upload macOS GUI
        if: needs.resolve-version.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.resolve-version.outputs.version }} "build/bin/Narration-Studio-${{ needs.resolve-version.outputs.version }}-OSX.zip" --clobber

      - name: Upload macOS CLI
        if: needs.resolve-version.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.resolve-version.outputs.version }} "build/bin/nstudio-cli-${{ needs.resolve-version.outputs.version }}-OSX" --clobber

  build-linux-gui:
    name: build-linux-gui (WebKit ${{ matrix.webkit }})
    needs: [resolve-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            gtk: gtk3
            webkit: '4.1'
            packages: libgtk-3-dev libwebkit2gtk-4.1-dev
          - runner: ubuntu-24.04
            gtk: gtk4
            webkit: '6.0'
            packages: libgtk-4-dev libwebkitgtk-6.0-dev
    runs-on: ${{ matrix.runner }}
    env:
      ZIP_NAME: Narration-Studio-${{ needs.resolve-version.outputs.version }}-Linux-WebKit-${{ matrix.webkit }}.zip
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libasound2-dev ${{ matrix.packages }}

      - name: Build piper native .so
        run: bash scripts/build-libpiper.sh

      - name: Build GUI and CLI
        run: bash scripts/build.sh ${{ matrix.gtk }}

      - name: Package GUI zip
        run: |
          mkdir -p staging
          cp build/bin/narration_studio build/bin/nstudio-cli build/bin/libpiper.so staging/
          cp -r build/bin/espeak-ng-data staging/
          find build/bin -name 'libonnxruntime*.so*' -exec cp {} staging/ \;
          cd staging && zip -r "../$ZIP_NAME" .

      - name: Upload GUI zip
        if: needs.resolve-version.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.resolve-version.outputs.version }} "$ZIP_NAME" --clobber

  build-linux-cli:
    needs: [resolve-version]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libasound-dev 2>/dev/null || sudo apt-get install -y build-essential pkg-config libasound-dev

      - name: Build CLI application
        run: |
          mkdir -p build/bin
          CGO_LDFLAGS="-L/usr/lib/x86_64-linux-gnu" go build -tags cli -o "build/bin/nstudio-cli-${{ needs.resolve-version.outputs.version }}-Linux" .

      - name: Upload Linux CLI
        if: needs.resolve-version.outputs.should_upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.resolve-version.outputs.version }} "build/bin/nstudio-cli-${{ needs.resolve-version.outputs.version }}-Linux" --clobber
